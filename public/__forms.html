<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Form registration</title></head><body>
<!-- Required for Netlify's HTML form detection at deployment. -->
<form name="inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="inquiry">
  <input name="bot-field">
  <input name="name"><input name="email"><input name="subject"><input name="product"><textarea name="message"></textarea>
</form></body></html>
