# Pages CMS product and page editor. All published content is localized.
media:
  input: public/images/uploads
  output: /images/uploads
  rename: safe
  categories:
  - image
content:
- name: products
  label: Products — KA / RU / EN
  type: collection
  path: src/data/products
  format: json
  filename: '{fields.slug}.json'
  view:
    primary: title.ka
    fields:
    - title.ka
    - category
    - published
    - featured
    - order
    sort:
    - order
    - title.ka
    search:
    - title.ka
    - title.ru
    - title.en
    - category
    default:
      sort: order
      order: asc
  fields:
  - name: slug
    label: URL slug (Latin letters, hyphens)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: 'Keep this stable once published. Example: round-concrete-basin'
  - name: title
    label: Product name in 3 languages
    type: object
    fields:
    - name: ka
      label: Georgian / ქართული
      type: string
      required: true
    - name: ru
      label: Russian / Русский
      type: string
      required: true
    - name: en
      label: English
      type: string
      required: true
  - name: category
    label: Shape / category
    type: select
    options:
      values:
      - Round
      - Oval
      - Rectangular
      - Custom
      - Other
    required: true
  - name: description
    label: Description in 3 languages
    type: object
    fields:
    - name: ka
      label: Georgian / ქართული
      type: text
    - name: ru
      label: Russian / Русский
      type: text
    - name: en
      label: English
      type: text
  - name: material
    label: Material in 3 languages
    type: object
    fields:
    - name: ka
      label: Georgian / ქართული
      type: string
    - name: ru
      label: Russian / Русский
      type: string
    - name: en
      label: English
      type: string
  - name: finish
    label: Finish in 3 languages
    type: object
    fields:
    - name: ka
      label: Georgian / ქართული
      type: string
    - name: ru
      label: Russian / Русский
      type: string
    - name: en
      label: English
      type: string
  - name: dimensions
    label: Dimensions (optional, by language)
    type: object
    fields:
    - name: ka
      label: Georgian / ქართული
      type: string
    - name: ru
      label: Russian / Русский
      type: string
    - name: en
      label: English
      type: string
  - name: coverImage
    label: Cover photograph
    type: image
    required: true
  - name: gallery
    label: Additional photographs
    type: image
    list:
      max: 10
  - name: alt
    label: Photo accessibility description
    type: object
    fields:
    - name: ka
      label: Georgian / ქართული
      type: string
    - name: ru
      label: Russian / Русский
      type: string
    - name: en
      label: English
      type: string
  - name: featured
    label: Featured on homepage
    type: boolean
  - name: published
    label: Publish on all language versions
    type: boolean
    description: Only enable when the Georgian, Russian, and English product names and descriptions are ready.
  - name: order
    label: Sort order (lower shows first)
    type: number
