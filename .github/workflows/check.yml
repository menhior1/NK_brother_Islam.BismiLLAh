name: Verify portfolio build

on:
  push:
    branches: [main, fix/tailwind-postcss-netlify]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Validate product data
        run: npm run check:content
      - name: Build Astro site
        run: npm run build
      - name: Save dependency lockfile on fix branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/tailwind-postcss-netlify'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile for Tailwind PostCSS integration"
            git push
          fi
